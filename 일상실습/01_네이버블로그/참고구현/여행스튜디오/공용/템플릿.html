<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{문서제목}}</title>
<!-- 글꼴: 외부(구글 글꼴)에 요청하지 않고 이 PC 에 있는 글꼴만 씁니다(검수 L9 — 미리보기를 열 때 외부 전송 없음).
     나눔고딕(네이버 에디터 기본 서체)이 설치되어 있으면 그것으로, 없으면 맑은 고딕(Windows)·애플 SD 고딕 Neo(Mac)로 비슷하게 보입니다. -->
<style>
  :root {
    --글꼴: 'Nanum Gothic', 'NanumGothic', '나눔고딕', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
    --글색: #333; --흐린글: #999; --선: #e5e5e5; --초록: #03c75a; --바탕: #f2f3f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--바탕); color: var(--글색); font-family: var(--글꼴); }

  /* 맨 위 안내 띠 */
  .띠 { position: sticky; top: 0; z-index: 10; background: #fff4c2; border-bottom: 1px solid #f0d878;
        padding: 8px 16px; font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .띠 strong { color: #8a6d00; }
  .띠 .단추 { margin-left: auto; display: flex; gap: 4px; }
  .띠 button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid #c9b45a; background: #fff;
               border-radius: 14px; cursor: pointer; }
  .띠 button[aria-pressed="true"] { background: #333; color: #fff; border-color: #333; }

  .무대 { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px 16px 60px; }
  .글틀 { background: #fff; width: 100%; max-width: 760px; padding: 40px 30px 50px; border: 1px solid var(--선); }
  body.모바일 .글틀 { max-width: 375px; padding: 24px 16px 40px; border-radius: 18px; box-shadow: 0 0 0 8px #222; }

  /* 제목 영역 */
  .카테고리 { font-size: 13px; color: var(--초록); margin-bottom: 10px; }
  .제목 { font-size: 30px; line-height: 1.4; font-weight: 400; margin: 0 0 14px; word-break: keep-all; }
  body.모바일 .제목 { font-size: 22px; }
  .글쓴이 { font-size: 13px; color: var(--흐린글); padding-bottom: 22px; border-bottom: 1px solid var(--선); margin-bottom: 30px; }

  /* 본문(문서 너비 700px) */
  .본문 { max-width: 700px; margin: 0 auto; font-size: 15px; line-height: 1.8; word-break: keep-all; overflow-wrap: anywhere; }
  .본문 p { margin: 0 0 1.1em; }
  .본문 a { color: #2b6cb0; }
  .소제목 { font-size: 22px; font-weight: 700; line-height: 1.5; margin: 2.2em 0 0.9em; }
  body.모바일 .소제목 { font-size: 19px; }
  .인용구 { margin: 2em 0; padding: 0 20px; text-align: center; }
  .인용구 .따옴표 { font-size: 40px; line-height: 1; color: #bbb; font-family: Georgia, serif; }
  .인용구 .말 { font-size: 18px; line-height: 1.7; margin: 6px 0 8px; }
  .인용구 .출처 { font-size: 13px; color: var(--흐린글); }
  .구분선 { border: 0; height: 1px; background: #ccc; width: 120px; margin: 2.4em auto; }
  .작게 { font-size: 13px; color: #777; line-height: 1.7; }
  .AI표기 { font-size: 13px; color: #666; background: #f7f7f7; border-radius: 6px; padding: 12px 14px; margin: 1.6em 0; }

  /* 사진 */
  figure { margin: 1.6em 0; text-align: center; }
  figure img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  figcaption { font-size: 13px; color: var(--흐린글); margin-top: 8px; }
  .대표표시 { font-size: 11px; color: #fff; background: var(--초록); border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
  .자리 { border: 2px dashed #b9c3cf; background: #f6f8fa; color: #4a5568; padding: 36px 20px; border-radius: 6px;
          font-size: 14px; line-height: 1.6; }
  .자리 b { display: block; color: #2d3748; margin-bottom: 4px; }
  .없음 { border: 2px solid #f5a3a3; background: #fff5f5; color: #a33; padding: 20px; font-size: 13px; }
  .콜라주 { display: grid; gap: 3px; grid-template-columns: repeat(var(--칸, 2), 1fr); }
  .콜라주 img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
  .콜라주 .넓게 { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
  .슬라이드 { position: relative; background: #000; }
  .슬라이드 img { display: none; max-height: 520px; width: 100%; object-fit: contain; }
  .슬라이드 img.보임 { display: block; }
  .슬라이드 button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.45); color: #fff;
                    border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .슬라이드 .앞 { left: 8px; } .슬라이드 .뒤 { right: 8px; }
  .슬라이드 .번호 { position: absolute; right: 10px; bottom: 8px; color: #fff; font-size: 12px; background: rgba(0,0,0,.45);
                   padding: 1px 8px; border-radius: 10px; }
  .영상 { position: relative; display: inline-block; }
  .영상::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-size: 48px; color: rgba(255,255,255,.9); text-shadow: 0 0 12px rgba(0,0,0,.6); }

  /* 지도·장소·꿀팁 */
  .지도 img { border: 1px solid var(--선); }
  .장소들 { border: 1px solid var(--선); border-radius: 6px; margin: 1.6em 0; overflow: hidden; }
  .장소들 .머리 { background: #eef7f1; font-size: 12px; color: #2f855a; padding: 6px 12px; }
  .장소 { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--선); font-size: 14px; }
  .장소 .핀 { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--초록); transform: rotate(-45deg); flex: none; }
  .꿀팁 { background: #fffbea; border: 1px solid #f6e05e; border-radius: 6px; padding: 14px 16px; margin: 1.6em 0; }
  .꿀팁 .이름 { font-weight: 700; color: #975a16; font-size: 13px; margin-bottom: 4px; }
  .참고자료 { margin: 2em 0 1em; font-size: 13px; color: #666; line-height: 1.7; }
  .참고자료 .이름 { font-weight: 700; color: #444; margin-bottom: 4px; }
  .참고자료 ul { margin: 0; padding-left: 18px; }
  .참고자료 li { margin-bottom: 4px; overflow-wrap: anywhere; }

  .태그 { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--선); font-size: 13px; color: #555; line-height: 2; }
  .태그 span { margin-right: 10px; }

  /* 작성자용 점검판(블로그에는 안 나옴) */
  .점검 { width: 300px; flex: none; background: #fff; border: 1px solid var(--선); padding: 16px; font-size: 13px; line-height: 1.6;
          position: sticky; top: 56px; }
  .점검 h2 { font-size: 14px; margin: 0 0 8px; }
  .점검 .주의 { color: #b7791f; } .점검 .문제 { color: #c53030; } .점검 .좋음 { color: #2f855a; }
  .점검 ul { padding-left: 18px; margin: 6px 0 12px; }
  .점검 .설명 { color: var(--흐린글); font-size: 12px; }
  @media (max-width: 1100px) { .무대 { flex-direction: column; align-items: center; } .점검 { width: 100%; max-width: 760px; position: static; } }
  @media (max-width: 420px) { .글틀 { padding: 24px 16px; } }
</style>
</head>
<body>
<div class="띠" role="note">
  <strong>모양 참고용 — 실제 네이버 화면과 다를 수 있음</strong>
  <span>콜라주 배열·사진 압축·장소 지도·블로그 스킨은 실제와 다릅니다. 최종 확인은 네이버 에디터의 기기 아이콘(PC·모바일)으로 하세요.</span>
  <span class="단추">
    <button type="button" id="pc" aria-pressed="true">PC</button>
    <button type="button" id="mo" aria-pressed="false">모바일(375px)</button>
  </span>
</div>
<div class="무대">
  <article class="글틀">
    <div class="카테고리">{{카테고리}}</div>
    <h1 class="제목">{{제목}}</h1>
    <div class="글쓴이">{{글쓴이}}</div>
    <div class="본문">
{{본문}}
    </div>
    <div class="태그">{{태그}}</div>
  </article>
  <aside class="점검" aria-label="작성자용 점검(블로그에는 안 나옴)">
{{점검}}
  </aside>
</div>
<script>
  // PC / 모바일 보기 바꾸기
  const pc = document.getElementById('pc'), mo = document.getElementById('mo');
  function 보기(모바일) {
    document.body.classList.toggle('모바일', 모바일);
    pc.setAttribute('aria-pressed', String(!모바일));
    mo.setAttribute('aria-pressed', String(모바일));
  }
  pc.onclick = () => 보기(false);
  mo.onclick = () => 보기(true);
  // 슬라이드 좌우 넘기기
  document.querySelectorAll('.슬라이드').forEach(s => {
    const imgs = [...s.querySelectorAll('img')], n = s.querySelector('.번호');
    let i = 0;
    const show = k => { i = (k + imgs.length) % imgs.length; imgs.forEach((im, j) => im.classList.toggle('보임', j === i)); if (n) n.textContent = (i + 1) + ' / ' + imgs.length; };
    s.querySelector('.앞').onclick = () => show(i - 1);
    s.querySelector('.뒤').onclick = () => show(i + 1);
    show(0);
  });
</script>
</body>
</html>
