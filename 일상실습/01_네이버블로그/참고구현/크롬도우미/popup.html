<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블로그 도우미 연결</title>
<style>
  :root { color-scheme: light dark; --g: #03c75a; --line: #c9d1d9; --sub: #57606a; --bg: #ffffff; --fg: #1f2328; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --fg: #e6e6e6; --line: #3d4148; --sub: #a0a6ad; } }
  body { margin: 0; width: 300px; font: 13px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--fg); }
  header { background: var(--g); color: #fff; padding: 8px 12px; font-weight: 700; }
  main { padding: 10px 12px 12px; }
  .state { margin: 0 0 8px; }
  .state[data-kind="on"]::before { content: "● "; color: var(--g); }
  .state[data-kind="off"]::before { content: "● "; color: #d1242f; }
  label { display: block; color: var(--sub); font-size: 12px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; letter-spacing: 6px; text-align: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { margin-top: 8px; width: 100%; padding: 7px; font: inherit; font-weight: 700; border-radius: 6px; border: 1px solid #02a54b; background: var(--g); color: #fff; cursor: pointer; }
  button.sub { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 400; }
  p.help { color: var(--sub); font-size: 12px; margin: 8px 0 0; }
  .msg { margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
  .msg[data-kind="error"] { color: #d1242f; }
  .msg[data-kind="done"] { color: #116329; }
  label.aux { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; color: var(--fg); font-size: 12px; }
  label.aux input { width: auto; font-size: 12px; letter-spacing: 0; margin: 0; }
</style>
</head>
<body>
<header>블로그 도우미 연결</header>
<main>
  <p class="state" id="state" data-kind="off" role="status">연결 상태 확인 중…</p>
  <form id="pair">
    <label for="code">연결 코드(숫자 6자리)</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" aria-label="연결 코드 6자리">
    <button type="submit" id="connect">연결</button>
  </form>
  <button type="button" class="sub" id="disconnect" hidden>연결 끊기</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <label class="aux"><input type="checkbox" id="aux"> '사진 묶음만 넣기'(보조 도구) 보이기</label>
  <p class="help">보조 도구를 켜면 글쓰기 화면 패널에서 <b>다른 글의 사진 묶음 목록</b>도 고를 수 있습니다. 필요할 때만 켜고, 다 쓰면 끄세요(기본: 꺼짐).</p>
  <p class="help">연결 코드는 여행 스튜디오의 [확장 연결] 화면, 또는 단체 블로그는
    <code>python 도구/발행서버.py --연결만</code>(또는 서버가 켜져 있으면 <code>--연결코드</code>)으로 받습니다(5분 동안 한 번만 쓸 수 있음).
    이 확장은 내 PC 의 127.0.0.1:8765 와만 이야기합니다.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
